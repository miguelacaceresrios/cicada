[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
cicada-core = { path = "crates/cicada-core" }
cicada-audio = { path = "crates/cicada-audio" }
cicada-visual = { path = "crates/cicada-visual" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
cpal = "0.18"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
png = "0.18"
